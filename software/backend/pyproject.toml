[project]
name = "mech421-radar-backend"
version = "0.1.0"
description = "Backend for the MECH 421 UWB ice radar: NanoVNA serial control and radar processing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyserial>=3.5",
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "matplotlib>=3.8",  # plots in software/analysis
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
